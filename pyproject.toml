[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "apt-fragment-to-task"
version = "0.1.0"
description = "A small, provider-agnostic pipeline for generating benchmark tasks from frozen fragments."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "APT-Bench contributors" }]
dependencies = []

[project.scripts]
fragment-to-task = "fragment_to_task.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

