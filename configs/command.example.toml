[run]
batch_size = 6
leakage_batch_size = 18
candidates_per_fragment = 3
include_borderline = true
transport_retries = 2
timeout_seconds = 900
min_task_words = 20
max_task_words = 180
task_language = "auto"
min_task_cjk_chars = 40
max_task_cjk_chars = 320

[provider]
kind = "command"

# The prompt is sent to stdin. The adapter may write JSON to {output_file}, or
# print JSON to stdout. Keep API keys in environment variables, never this file.
command = [
  "python",
  "adapter.py",
  "--stage", "{stage}",
  "--schema", "{schema_file}",
  "--output", "{output_file}"
]


[few_shot.generation]
enabled = false
examples_per_batch = 4
